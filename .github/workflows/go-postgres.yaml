name: Go PostgreSQL Tests

# Runs the store conformance suite on PostgreSQL, which the shared Go CI
# workflow cannot: row locking and concurrent claims behave differently
# there than on SQLite.

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-postgres.yaml'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-postgres.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SUPPORTFORGE_TEST_PG_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      SUPPORTFORGE_TEST_PG_REQUIRED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run the store tests on PostgreSQL
        run: go test -race -timeout=10m ./store/...
